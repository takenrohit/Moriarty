<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Incidents')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main>
<h1>Incidents</h1>
<p class="muted">Newest first.</p>

<p th:if="${#lists.isEmpty(incidents)}">No incidents yet.</p>

<table th:unless="${#lists.isEmpty(incidents)}">
  <thead>
  <tr>
    <th>Detected</th>
    <th>Incident</th>
    <th>Service</th>
    <th>Severity</th>
    <th>Incident status</th>
    <th>Investigation</th>
  </tr>
  </thead>
  <tbody>
  <tr th:each="i : ${incidents}">
    <td th:text="${i.detected}">2026-11-23 20:10 IST</td>
    <td><a th:href="@{/incidents/{id}(id=${i.id})}" th:text="${i.title}">HighErrorRate on checkout-api</a>
      <div class="muted ev" th:text="${i.id}">inc-000000000000</div></td>
    <td th:text="${i.service}">checkout-api</td>
    <td><span th:replace="~{fragments/badges :: severity(${i.severity})}">Critical</span></td>
    <td th:text="${i.incidentStatus}">REPORTED</td>
    <td><span th:replace="~{fragments/badges :: status(${i.investigationStatus})}">COMPLETED</span></td>
  </tr>
  </tbody>
</table>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
