<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Incidents')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main>
<h1>Incidents</h1>
<p class="muted">Newest first. The table refreshes every 10 seconds.</p>
<p id="refresh-failed" class="refresh-failed" role="status" hidden>Refresh failed; showing the last loaded table.</p>

<!--/* data-live-list marks the list page so console.js starts the 10-second refresh only here. */-->
<table id="incident-table" data-live-list>
  <thead>
  <tr>
    <th>ID</th>
    <th>Title</th>
    <th>Service</th>
    <th>Severity</th>
    <th>Detected</th>
    <th>Status</th>
  </tr>
  </thead>
  <tbody th:replace="~{fragments/incident-rows :: rows}"></tbody>
</table>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
