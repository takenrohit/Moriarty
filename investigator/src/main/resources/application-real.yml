# "real" profile: each integration whose base URL is non-blank uses its real client; a blank or unset
# URL falls back to the mock client (Req 7.1, 7.2, CP-61). Every value comes from the environment
# (Req 7.5, 7.6, 15.2); credentials default to empty and are never logged.
management:
  otlp:
    tracing:
      # Investigator spans over OTLP/HTTP to the Compose otel-collector, which forwards them to Tempo (CP-69).
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://otel-collector:4318/v1/traces}
investigator:
  integrations:
    metrics:
      base-url: ${PROMETHEUS_URL:}
      bearer-token: ${PROMETHEUS_BEARER_TOKEN:}
      username: ${PROMETHEUS_USERNAME:}
      password: ${PROMETHEUS_PASSWORD:}
      connect-timeout: ${PROMETHEUS_CONNECT_TIMEOUT:2s}
      read-timeout: ${PROMETHEUS_READ_TIMEOUT:10s}
    logs:
      base-url: ${LOKI_URL:}
      bearer-token: ${LOKI_BEARER_TOKEN:}
      username: ${LOKI_USERNAME:}
      password: ${LOKI_PASSWORD:}
      connect-timeout: ${LOKI_CONNECT_TIMEOUT:2s}
      read-timeout: ${LOKI_READ_TIMEOUT:10s}
      # Loki stream label holding the service name; OTLP-ingested logs use service_name.
      service-label: ${LOKI_SERVICE_LABEL:service_name}
    traces:
      base-url: ${TEMPO_URL:}
      bearer-token: ${TEMPO_BEARER_TOKEN:}
      username: ${TEMPO_USERNAME:}
      password: ${TEMPO_PASSWORD:}
      connect-timeout: ${TEMPO_CONNECT_TIMEOUT:2s}
      read-timeout: ${TEMPO_READ_TIMEOUT:10s}
    changes:
      # GitHub REST API; Compose defaults GITHUB_API_URL to the Fake GitHub (CP-46). Real GitHub:
      # https://api.github.com with GITHUB_REPOSITORY and a read-only GITHUB_TOKEN.
      base-url: ${GITHUB_API_URL:}
      bearer-token: ${GITHUB_TOKEN:}
      connect-timeout: ${GITHUB_CONNECT_TIMEOUT:2s}
      read-timeout: ${GITHUB_READ_TIMEOUT:10s}
      # owner/repo whose deployments are read; required when base-url is set.
      repository: ${GITHUB_REPOSITORY:}
