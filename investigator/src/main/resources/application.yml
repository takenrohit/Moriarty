spring:
  application:
    name: investigator
  profiles:
    default: mock             # mock integrations unless SPRING_PROFILES_ACTIVE names another profile
  threads:
    virtual:
      enabled: true
  flyway:
    enabled: false            # enabled by the "postgres" profile (application-postgres.yml)
  autoconfigure:
    # No database outside the "postgres" profile: the in-memory repositories are used (Req 12.3, CP-48).
    # application-postgres.yml clears this list.
    exclude: org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

logging:
  structured:
    format:
      console: logstash       # one JSON object per line; MDC and SLF4J key-value pairs become fields

management:
  health:
    redis:
      enabled: false          # no Redis outside the "redis" profile; application-redis.yml turns it on
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    distribution:
      percentiles-histogram:  # _bucket series for the dashboards' p50/p95 panels (CP-70)
        "[investigator.investigation.duration]": true
        "[investigator.tool.latency]": true
        "[investigator.approval.wait]": true
  tracing:
    sampling:
      probability: 1.0        # every investigation is traced; spans stay in memory without an endpoint
  # management.otlp.tracing.endpoint is set only in application-real.yml: Spring Boot treats any value,
  # even an empty one, as "configured" and an empty URL fails the exporter at startup (CP-78).

investigator:
  display-timezone: ${INVESTIGATOR_DISPLAY_TIMEZONE:Asia/Kolkata}
  public-base-url: ${INVESTIGATOR_PUBLIC_URL:http://localhost:8080}   # links in Slack messages
  slack:                                          # blank token and channel: Slack publishing is off
    bot-token: ${SLACK_BOT_TOKEN:}
    signing-secret: ${SLACK_SIGNING_SECRET:}
    channel-id: ${SLACK_CHANNEL_ID:}
    api-url: ${SLACK_API_URL:https://slack.com/api}
  window:
    look-back: 60m
    look-ahead: 10m
    max-span: 6h
  budget:
    max-tool-calls: 15
    timeout: 3m
  tools:
    max-query-length: 1000
    max-symptom-length: 200
    max-lookback-hours: 24
    max-span: 6h
    max-result-bytes: 4096
    max-metric-points: 300
    min-metric-step: 15s
    log-fetch-limit: 500
    log-top-messages: 5
    trace-limit: 50
    trace-examples: 3
    slow-trace-threshold: 2s
    max-changed-files: 20
  agent:
    memory-max-messages: 64
  services:
    checkout-api:
      dependencies: [payment-gateway]
    payment-gateway:
      dependencies: [payment-provider]
    payment-provider:
      dependencies: []
  webhook:
    secret: ${WEBHOOK_SECRET:}                    # blank: alert endpoints accept unauthenticated requests
    service-label: ${WEBHOOK_SERVICE_LABEL:service}
  mock:
    default-anchor: 2026-11-23T14:40:00Z   # Scenario_Anchor when no investigation scope is bound
  llm:
    enabled: true
    base-url: ${LLM_BASE_URL:https://api.openai.com/v1}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:gpt-4o-mini}
    json-mode: ${LLM_JSON_MODE:true}
    temperature: 0.0
    request-timeout: 60s
    max-retries: ${LLM_MAX_RETRIES:2}   # raise (e.g. 10) for rate-limited free tiers
