name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # verify also runs the Failsafe *IT tests, including the `containers`-tagged
      # Testcontainers tests (PostgreSQL, Redis, Prometheus); ubuntu-latest has Docker.
      - name: Build and test investigator
        working-directory: investigator
        run: ./mvnw -B verify

  mock-services:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test mock-services
        working-directory: mock-services
        run: ./mvnw -B verify
