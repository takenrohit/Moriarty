# Loki 3.7 single-binary configuration for the local Compose stack.
# Mounted read-only at /etc/loki. Data lives in /loki inside the container.
# Logs arrive from the OTel Collector on the native OTLP endpoint (/otlp/v1/logs);
# the service.name resource attribute becomes the service_name stream label.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 50

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Required for OTLP ingestion: non-label attributes are kept as structured metadata.
  allow_structured_metadata: true

analytics:
  reporting_enabled: false
