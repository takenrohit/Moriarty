# Tempo 3.1 monolithic (single-binary, -target=all) configuration for the local Compose stack.
# Monolithic mode needs no Kafka: the distributor pushes spans in-process to the live-store.
# Mounted read-only at /etc/tempo. Data lives in /var/tempo inside the container.
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: info

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

usage_report:
  reporting_enabled: false
