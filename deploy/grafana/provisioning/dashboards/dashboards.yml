# Grafana dashboard provider for the local Compose stack (CP-71).
# Loads the JSON dashboards mounted read-only from deploy/grafana/dashboards.
apiVersion: 1

providers:
  - name: investigator
    folder: Investigator
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/dashboards
