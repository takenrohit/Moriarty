# Alertmanager v0.35 configuration for the local Compose stack.
# Mounted read-only at /etc/alertmanager.
# Every alert is posted to the investigator's Alertmanager webhook (plan 2.3, Req 8.1).
# Short group timings keep the demo fast: the first notification goes out ~5 s after the
# alert fires, and resolved notifications are sent too (the investigator acknowledges them).
route:
  receiver: investigator
  group_by: ["alertname", "service"]
  group_wait: 5s
  group_interval: 30s
  repeat_interval: 1h

receivers:
  - name: investigator
    webhook_configs:
      - url: http://investigator:8080/api/v1/alerts/alertmanager
        send_resolved: true
        max_alerts: 0
        # Webhook authentication is off by default: the investigator accepts alerts when
        # WEBHOOK_SECRET is unset (CP-51). Alertmanager does not expand environment variables
        # in this file, so to enable it without committing the secret:
        #   1. set WEBHOOK_SECRET in investigator/.env;
        #   2. write the same value (surrounding whitespace is trimmed) to
        #      deploy/alertmanager/webhook-token (git-ignored; mounted with this directory);
        #   3. uncomment the block below and restart alertmanager and investigator.
        # http_config:
        #   authorization:
        #     type: Bearer
        #     credentials_file: /etc/alertmanager/webhook-token
